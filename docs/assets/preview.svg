<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="HomeLab Landing: one node running multiple apps">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#0f7a63" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0f7a63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="360" fill="#f7f9f8"/>
  <rect width="720" height="360" fill="url(#glow)"/>

  <!-- faint orbiting node grid, abstract infrastructure motif -->
  <g stroke="#dfe7e3" stroke-width="1.4" fill="none">
    <circle cx="360" cy="150" r="110"/>
    <circle cx="360" cy="150" r="150"/>
  </g>
  <g fill="#5ba3b0" opacity="0.55">
    <circle cx="360" cy="40" r="3.5"/>
    <circle cx="250" cy="72" r="3.5"/>
    <circle cx="470" cy="72" r="3.5"/>
    <circle cx="210" cy="150" r="3.5"/>
    <circle cx="510" cy="150" r="3.5"/>
    <circle cx="250" cy="228" r="3.5"/>
    <circle cx="470" cy="228" r="3.5"/>
    <circle cx="360" cy="260" r="3.5"/>
  </g>

  <!-- the real brand mark, scaled up: one node running multiple apps -->
  <g transform="translate(300,90)">
    <rect width="120" height="120" rx="28" fill="#0f7a63"/>
    <line x1="60" y1="47" x2="34" y2="86" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="47" x2="86" y2="86" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="34" cy="86" r="10.5" fill="#ffffff"/>
    <circle cx="86" cy="86" r="10.5" fill="#ffffff"/>
    <circle cx="60" cy="45" r="16" fill="#ffffff"/>
  </g>

  <text x="360" y="272" font-family="Geist, system-ui, sans-serif" font-size="34" font-weight="700" fill="#131d1a" text-anchor="middle">HomeLab</text>
  <text x="360" y="300" font-family="Geist Mono, ui-monospace, monospace" font-size="14" letter-spacing="1" fill="#5c6b66" text-anchor="middle">ONE VPS &#183; DECLARED IN GIT</text>
</svg>
