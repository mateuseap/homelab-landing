name: Publish Images to GHCR

# Builds the static nginx image the HomeLab cluster serves at
# HomeLab.mateuseap.com. Deployed by ArgoCD from mateuseap/homelab
# (apps/landing). Tracks :latest; after merge to main the cluster pulls it.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/homelab-landing:latest
            ghcr.io/${{ github.repository_owner }}/homelab-landing:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
